<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instant Scripture Engine — ProView</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- CLEAN, UNCROWDED TOP NAVBAR FOR SCRIPTURE ENGINE -->
  <header class="site-navbar">
    <div style="display:flex;align-items:center;gap:14px;">
      <a href="index.html" class="brand-link">
        <div class="brand-mark">PV</div>
        <span>ProView</span>
      </a>
      <span class="page-context-pill">Scripture Engine</span>
    </div>

    <nav class="page-nav-links" aria-label="Scripture Navigation">
      <a href="admin.html" class="page-nav-link">← Admin</a>
      <a href="operator.html" class="page-nav-link">Operator →</a>
    </nav>

    <div class="nav-right-controls">
      <button id="theme-toggle-btn" class="theme-toggle-btn" onclick="ProViewApp.toggleTheme()">
        🌙 Dark
      </button>
    </div>
  </header>

  <main>
    <section class="section" style="padding:48px 0;">
      <div class="container">
        <div class="grid-2" style="align-items:start;">
          <div class="panel-card">
            <div class="panel-header">
              <h3>Instant Scripture Engine</h3>
            </div>
            <div class="panel-body">
              <div class="form-group">
                <label class="form-label" for="scripture-preset-select">Select Passage</label>
                <select id="scripture-preset-select" class="form-select" onchange="ProViewApp.loadScripturePreset()">
                  <option value="John 3:16-18">John 3:16-18</option>
                  <option value="Psalm 23:1-6">Psalm 23:1-6</option>
                  <option value="Romans 8:31-39">Romans 8:31-39</option>
                  <option value="Isaiah 40:28-31">Isaiah 40:28-31</option>
                </select>
              </div>

              <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                <div class="form-group">
                  <label class="form-label" for="scripture-ref-input">Reference</label>
                  <input type="text" id="scripture-ref-input" class="form-input" value="John 3:16-18" oninput="ProViewApp.renderAdminScriptureTab()" />
                </div>
                <div class="form-group">
                  <label class="form-label" for="scripture-translation-select">Translation</label>
                  <select id="scripture-translation-select" class="form-select" onchange="ProViewApp.loadScripturePreset()">
                    <option value="ESV">ESV</option>
                    <option value="NIV">NIV</option>
                    <option value="KJV">KJV</option>
                    <option value="NLT">NLT</option>
                  </select>
                </div>
              </div>

              <div class="form-group">
                <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
                  <label class="form-label" for="scripture-reflow-slider">Reflow Density</label>
                  <span id="scripture-char-label" class="font-mono" style="font-size:0.8rem;">145 chars / slide</span>
                </div>
                <input type="range" id="scripture-reflow-slider" min="75" max="260" value="145" style="width:100%;" oninput="ProViewApp.renderAdminScriptureTab()" />
              </div>

              <div class="form-group">
                <label class="form-label" for="scripture-custom-textarea">Verse Text</label>
                <textarea id="scripture-custom-textarea" class="form-textarea" oninput="ProViewApp.renderAdminScriptureTab()">For God so loved the world, that he gave his only Son, that whoever believes in him should not perish but have eternal life. For God did not send his Son into the world to condemn the world, but in order that the world might be saved through him.</textarea>
              </div>

              <div class="form-group">
                <label class="form-label" for="scripture-target-service">Add to Service</label>
                <select id="scripture-target-service" class="form-select"></select>
              </div>

              <div style="display:flex;gap:10px;">
                <button type="button" class="btn btn-primary" style="flex:1;" onclick="ProViewApp.pushScriptureToActiveService(false)">
                  + Add to Service
                </button>
                <button type="button" class="btn btn-emerald" style="flex:1;" onclick="ProViewApp.pushScriptureToActiveService(true)">
                  Add &amp; Open Operator →
                </button>
              </div>
            </div>
          </div>

          <div class="panel-card">
            <div class="panel-header">
              <h3>Auto-Reflowed Slides</h3>
            </div>
            <div class="panel-body">
              <div id="scripture-engine-slides-preview" class="reflow-slides-preview"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/default-data.js"></script>
  <script src="js/bread-service.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
