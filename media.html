<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Media Library — ProView</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- CLEAN, UNCROWDED TOP NAVBAR FOR MEDIA LIBRARY -->
  <header class="site-navbar">
    <div style="display:flex;align-items:center;gap:14px;">
      <a href="index.html" class="brand-link">
        <div class="brand-mark">PV</div>
        <span>ProView</span>
      </a>
      <span class="page-context-pill">Media Library</span>
    </div>

    <nav class="page-nav-links" aria-label="Media Navigation">
      <a href="admin.html" class="page-nav-link">← Admin</a>
      <a href="operator.html" class="page-nav-link">Operator →</a>
    </nav>

    <div class="nav-right-controls">
      <button id="theme-toggle-btn" class="theme-toggle-btn" onclick="ProViewApp.toggleTheme()">
        🌙 Dark
      </button>
    </div>
  </header>

  <main>
    <section class="section" style="padding:48px 0;">
      <div class="container">
        <div class="grid-2" style="align-items:start;">
          <div class="panel-card">
            <div class="panel-header">
              <h3>Upload Media</h3>
            </div>
            <div class="panel-body">
              <form onsubmit="ProViewApp.handleMediaUpload(event)">
                <div class="form-group">
                  <label class="form-label" for="myFile">Select Image or Video (Max 50MB)</label>
                  <input type="file" id="myFile" class="form-input" accept="image/*,video/*" required />
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;">Upload File</button>
              </form>
            </div>
          </div>

          <div style="display:flex;flex-direction:column;gap:28px;">
            <div class="panel-card">
              <div class="panel-header">
                <h3>Uploaded Media</h3>
              </div>
              <div class="panel-body">
                <div id="admin-uploaded-files-grid" class="grid-2"></div>
              </div>
            </div>

            <div class="panel-card">
              <div class="panel-header">
                <h3>Built-In Sanctuary Backgrounds</h3>
              </div>
              <div class="panel-body">
                <div id="admin-builtin-backgrounds" class="grid-2"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/default-data.js"></script>
  <script src="js/bread-service.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
