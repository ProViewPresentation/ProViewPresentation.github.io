<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free Account — ProView</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- CLEAN, UNCROWDED TOP NAVBAR FOR ACCOUNT PAGE -->
  <header class="site-navbar">
    <a href="index.html" class="brand-link">
      <div class="brand-mark">PV</div>
      <span>ProView</span>
      <span class="badge-free">100% Free</span>
    </a>

    <nav class="page-nav-links" aria-label="Account Navigation">
      <a href="index.html" class="page-nav-link">← Overview</a>
      <a href="operator.html" class="page-nav-link">Operator</a>
      <a href="admin.html" class="page-nav-link">Admin</a>
    </nav>

    <div class="nav-right-controls">
      <button id="theme-toggle-btn" class="theme-toggle-btn" onclick="ProViewApp.toggleTheme()">
        🌙 Dark
      </button>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container" style="max-width:540px;">
        <div id="active-session-card" class="card" style="display:none;margin-bottom:28px;"></div>

        <div class="card">
          <h1 style="font-size:1.75rem;margin-bottom:8px;">Free Church Account</h1>
          <p style="margin-bottom:24px;">Create a 100% free account or sign in to sync your church services and song library.</p>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:24px;">
            <button id="tab-btn-signup" type="button" class="btn btn-sm btn-primary" onclick="ProViewApp.switchAccountTab('signup')">
              Create Account
            </button>
            <button id="tab-btn-login" type="button" class="btn btn-sm btn-outline" onclick="ProViewApp.switchAccountTab('login')">
              Sign In
            </button>
          </div>

          <form id="auth-page-form" data-mode="signup" onsubmit="ProViewApp.submitAccountForm(event)">
            <div id="signup-extra-fields">
              <div class="form-group">
                <label class="form-label" for="auth-church">Church Name</label>
                <input type="text" id="auth-church" class="form-input" placeholder="Grace Sanctuary Fellowship" />
              </div>
              <div class="form-group">
                <label class="form-label" for="auth-ccli">CCLI License # (Optional)</label>
                <input type="text" id="auth-ccli" class="form-input" placeholder="CCLI #11482903" />
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="auth-email">Email Address</label>
              <input type="email" id="auth-email" class="form-input" placeholder="worship@church.org" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="auth-password">Password</label>
              <input type="password" id="auth-password" class="form-input" placeholder="Minimum 6 characters" minlength="6" required />
            </div>

            <button type="submit" id="auth-submit-btn" class="btn btn-primary" style="width:100%;">
              Create Free Account
            </button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/default-data.js"></script>
  <script src="js/bread-service.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
