<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOH Output (Back of House Stage Display) — ProView</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- BOH (BACK OF HOUSE) STAGE SCREEN — NO BACKGROUND, SHOWS SLIDE, NEXT LYRIC, TIME & PRESENTER INFO -->
  <main class="boh-screen-layout">

    <!-- TOP BAR: TIME, TIMER, EXTRA PRESENTER/SINGER INFO & FULLSCREEN -->
    <header class="boh-top-bar">
      <div style="display:flex;align-items:center;gap:28px;flex-wrap:wrap;">
        <div>
          <div class="font-mono" style="font-size:0.74rem;color:var(--text-muted);">CURRENT TIME</div>
          <div id="boh-live-clock" class="font-mono" style="font-size:1.75rem;font-weight:700;">10:45:00 AM</div>
        </div>

        <div style="border-left:1px solid var(--border-subtle);padding-left:24px;">
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="font-mono" style="font-size:0.74rem;color:var(--text-muted);">TIMER</span>
            <button type="button" class="btn btn-sm btn-outline" style="padding:2px 8px;font-size:0.72rem;" onclick="ProViewApp.toggleStageTimer()">Start/Pause</button>
            <button type="button" class="btn btn-sm btn-outline" style="padding:2px 8px;font-size:0.72rem;" onclick="ProViewApp.resetStageTimer(35)">Reset</button>
          </div>
          <div id="boh-countdown-timer" class="font-mono" style="font-size:1.75rem;font-weight:700;color:var(--accent-amber);">35:00</div>
        </div>

        <div style="border-left:1px solid var(--border-subtle);padding-left:24px;">
          <div id="boh-slide-counter" class="font-mono" style="font-size:0.76rem;color:var(--accent-blue);font-weight:700;">
            Slide 1 of 4
          </div>
          <div id="boh-extra-info" style="font-size:0.95rem;color:var(--text-secondary);font-weight:500;">
            Presenter &amp; Singer Info
          </div>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:10px;">
        <button id="theme-toggle-btn" class="theme-toggle-btn" onclick="ProViewApp.toggleTheme()">
          🌙 Dark
        </button>
        <button type="button" class="btn btn-sm btn-primary" onclick="ProViewApp.toggleFullscreen()">
          ⛶ Fullscreen
        </button>
      </div>
    </header>

    <!-- CURRENT SLIDE / LYRIC (NO BACKGROUND) -->
    <section class="boh-current-slide-box">
      <div class="font-mono" style="font-size:0.78rem;color:var(--accent-emerald);font-weight:700;margin-bottom:14px;">
        CURRENT SLIDE / LYRIC
      </div>
      <div
        id="boh-current-text"
        style="font-size:clamp(2.1rem,3.8vw,3.4rem);font-weight:700;line-height:1.35;white-space:pre-line;"
      >
        Bless the Lord, O my soul, O my soul
        Worship His holy name
      </div>
    </section>

    <!-- NEXT LYRIC SANG / NEXT SLIDE (NO BACKGROUND) -->
    <section class="boh-next-slide-box">
      <div id="boh-next-heading" class="font-mono" style="font-size:0.8rem;color:var(--text-muted);font-weight:700;margin-bottom:10px;">
        NEXT LYRIC SANG:
      </div>
      <div
        id="boh-next-text"
        style="font-size:clamp(1.25rem,2.1vw,1.75rem);color:var(--text-secondary);line-height:1.45;white-space:pre-line;font-weight:500;"
      >
        The sun comes up, it's a new day dawning
      </div>
    </section>

  </main>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/default-data.js"></script>
  <script src="js/bread-service.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
