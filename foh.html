<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FOH Output (Front of House) — ProView</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body style="margin:0;padding:0;overflow:hidden;background:#000000;">

  <!-- Floating Fullscreen Bar (Drag window to main screen, then click Fullscreen) -->
  <div class="output-floating-bar">
    <span class="font-mono" style="font-size:0.78rem;opacity:0.85;">FOH MAIN OUTPUT</span>
    <button type="button" class="btn btn-sm btn-emerald" onclick="ProViewApp.toggleFullscreen()">
      ⛶ Fullscreen
    </button>
  </div>

  <!-- Full-Viewport Main Screen Output -->
  <main
    id="foh-screen-canvas"
    style="width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;"
  ></main>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/default-data.js"></script>
  <script src="js/bread-service.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
